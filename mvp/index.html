// (budget lock, ensure_budget copy, transaction = signed lines). Methods are async so the
// screens are written the way they will be against a real backend.
const KEY = 'trax.mvp.v4';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const clone = v => JSON.parse(JSON.stringify(v));
const stamp = () => new Date().toISOString();
let db = null;

function loadDb() {
  if (db) return db;
  try {
    const s = JSON.parse(lsGet(KEY));
    if (s && s.v === 4) return (db = s);
  } catch {}
  // Older versions are dropped, not migrated: the prototype only ever holds dummy data.
  for (const old of ['trax.mvp.v1', 'trax.mvp.v2', 'trax.mvp.v3', 'trax.lastPocket']) lsDel(old);
  db = seed();
  ensureOthers(db);
  saveDb();
  return db;
}
const saveDb = () => lsSet(KEY, JSON.stringify(db));

// Every expense and income has a category; "Others" is the catch-all and the default.
// Only transfers, balance adjustments and AR/AP stay out of it. Run on the seed, which
// leaves those categories unset.
const ADJUSTMENTS = ['Opening balance', 'Balance adjustment'];
function othersId(categories, kind) {
  return (categories.find(c => c.name === 'Others' && c.kind === kind && !c.archived)
    ?? categories.find(c => c.kind === kind && !c.archived))?.id ?? null;
}
// AR and AP are system categories (kind "debt") for the transactions the AR/AP screen
// creates. They are neither spending nor income, so budgets and totals skip them.
const debtCatId = (categories, kind) => categories.find(c => c.kind === 'debt' && c.name === kind)?.id ?? null;
function ensureOthers(s) {
  for (const kind of ['expense', 'income']) {
    if (!s.categories.some(c => c.name === 'Others' && c.kind === kind && !c.archived))
      s.categories.push({ id: uid(), name: 'Others', kind, sort: 999, archived: false, created_at: stamp() });
  }
  for (const [name, sort] of [['AR', 1000], ['AP', 1001]]) {
    if (!debtCatId(s.categories, name)) s.categories.push({ id: uid(), name, kind: 'debt', sort, archived: false, created_at: stamp() });
  }
  for (const t of s.transactions) {
    if (t.category_id || ADJUSTMENTS.includes(t.name)) continue;
    const k = shape(t.lines).kind;
    if (k === 'out' || k === 'in') t.category_id = othersId(s.categories, k === 'out' ? 'expense' : 'income');
  }
}

// Dummy data shaped like the sheet's Oct 26 tab: last month and this month up to today, with
// the same kinds of rows — salary, daily lunch, top-ups with admin fees, cash withdrawals,
// split payments, the Kos sub-pocket, a loan that becomes AR, funds held for others as AP.
function seed() {
  if (BACKFILL) return clone(BACKFILL);
  const s = { v: 4, pockets: [], categories: [], transactions: [], debts: [], periods: [], items: [] };
  const pocket = (name, extra = {}) => { const p = { id: uid(), name, parent_id: null, sort: s.pockets.length, archived: false, created_at: stamp(), ...extra }; s.pockets.push(p); return p.id; };
  const P = {};
  P.BCA = pocket('BCA');
  P.Kos = pocket('Kos', { parent_id: P.BCA });
  for (const n of ['Mandiri', 'Cash', 'Gopay', 'ShopeePay', 'Ovo']) P[n] = pocket(n);

  const C = {};
  DEFAULT_BUDGET.forEach(([name], i) => { C[name] = uid(); s.categories.push({ id: C[name], name, kind: 'expense', sort: i, archived: false, created_at: stamp() }); });
  C.Salary = uid();
  s.categories.push({ id: C.Salary, name: 'Salary', kind: 'income', sort: 100, archived: false, created_at: stamp() });
  for (const [name, sort] of [['AR', 1000], ['AP', 1001]]) { C[name] = uid(); s.categories.push({ id: C[name], name, kind: 'debt', sort, archived: false, created_at: stamp() }); }

  const cur = curMonth(), prev = addMonths(cur, -1);
  for (const month of [prev, cur]) {
    const pid = uid();
    s.periods.push({ id: pid, month, income: 7500000, target_eomb: 2000000 });
    DEFAULT_BUDGET.forEach(([name, price, unit, qty], i) => s.items.push({ id: uid(), period_id: pid, category_id: C[name], price, unit, qty, sort: i }));
  }

  let seq = 0;
  const tx = (date, name, cat, lines) => {
    const t = { id: uid(), date, name, category_id: cat ? C[cat] : null,
      created_at: `${date}T08:00:${pad(Math.floor(seq / 60) % 60)}.${String(seq++).padStart(3, '0')}Z`,
      lines: lines.map(([p, amount]) => ({ id: uid(), pocket_id: P[p], amount })) };
    s.transactions.push(t);
    return t;
  };
  let loanTx = null;

  // Deterministic pseudo-random amounts so a reset always gives the same data.
  let r = 7;
  const rnd = (lo, hi, step = 100) => { r = (r * 16807) % 2147483647; return lo + Math.floor(((r % 10000) / 10000) * ((hi - lo) / step + 1)) * step; };

  tx(prev, 'Opening balance', null, [['BCA', 6433815], ['Kos', 3389642], ['Mandiri', 34967679], ['Cash', 700000], ['Gopay', 107083], ['ShopeePay', 48397], ['Ovo', 21089]]);
  const end = today();
  for (const month of [prev, cur]) {
    const days = new Date(parseISO(month).getFullYear(), parseISO(month).getMonth() + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const date = month.slice(0, 8) + pad(d);
      if (date > end) break;
      const dow = parseISO(date).getDay(), weekday = dow > 0 && dow < 6;
      if (d === 1) tx(date, 'Spotify', 'Spotify', [['Mandiri', -79900]]);
      if (d === 2) tx(date, 'Salary', 'Salary', [['BCA', 6660829]]);
      if (d === 3) tx(date, 'Wifi', null, [['Kos', -807423]]);
      if (d === 5) tx(date, 'Gym', 'Gym', [['BCA', -185000]]);
      if (d === 1 || d === 15) tx(date, 'Top up from Mandiri to ShopeePay', null, [['Mandiri', -201000], ['ShopeePay', 200000]]);
      if (d === 1) tx(date, 'Top up from Mandiri to Gopay', null, [['Mandiri', -801200], ['Gopay', 800000]]);
      if (d === 12) tx(date, 'Car wash', 'Hobby', [['BCA', -50000], ['Cash', -10000]]);
      if (d === 15) tx(date, 'Top up from Mandiri to Cash', null, [['Mandiri', -300000], ['Cash', 300000]]);
      if (d === 16 && month === prev) loanTx = tx(date, 'Loan to Akbar', 'AR', [['BCA', -1000000]]);
      if (d === 19) tx(date, 'Rent received', null, [['Kos', 1000000]]);
      if (d === 27) tx(date, 'Top up from Mandiri to Gopay', null, [['Mandiri', -301200], ['Gopay', 300000]]);
      if (d === 27) tx(date, 'Claude', 'Claude', [['Gopay', -349000]]);
      if (weekday) {
        tx(date, 'Lunch', 'Office lunch', [[rnd(0, 3, 1) ? 'BCA' : 'ShopeePay', -rnd(22000, 38000)]]);
        if (dow === 1) tx(date, 'E-toll top up', 'Office transport', [['Mandiri', -100000]]);
        if (rnd(0, 1, 1)) tx(date, 'Snacks', null, [['BCA', -rnd(7000, 40000)]]);
        if (dow === 3) tx(date, 'Coffee', 'Hobby', [['BCA', -17000]]);
      } else {
        if (dow === 6) tx(date, 'Tennis', 'Hobby', [['BCA', -rnd(117000, 200000, 500)], ['Cash', -rnd(5000, 20000, 1000)]]);
        if (dow === 6 && d % 2) tx(date, 'Gas', 'Gas/toll', [['BCA', -300000]]);
        tx(date, 'Dinner', 'Date', [[rnd(0, 3, 1) ? 'BCA' : 'Gopay', -rnd(90000, 320000)]]);
      }
    }
  }

  const debt = (kind, date, name, amount, settled_at = null, open_tx_id = null) =>
    s.debts.push({ id: uid(), kind, date, name, amount, settled_at, open_tx_id, settle_tx_id: null, created_at: stamp() });
  debt('AR', prev.slice(0, 8) + '16', 'Loan to Akbar', 1000000, null, loanTx?.id);
  debt('AR', cur, 'Mom\'s lunch', 32786);
  debt('AR', prev.slice(0, 8) + '05', 'Hotel split', 397514, prev.slice(0, 8) + '20');
  debt('AP', prev, 'Funds held for family', 20000000);
  return s;
}

function withNet(t) {
  const lines = t.lines.map(l => ({ ...l, amount: Number(l.amount) }));
  return { ...t, lines, net: lines.reduce((s, l) => s + l.amount, 0) };
}

const byCreatedDesc = (a, b) => (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0);
const bySort = (a, b) => a.sort - b.sort || (a.created_at < b.created_at ? -1 : 1);

function guardPeriod(periodId) {
  const p = db.periods.find(p => p.id === periodId);
  if (!p) throw new Error('Budget not found');
  if (p.month <= curMonth()) throw new Error(`The ${monthLabel(p.month)} budget is locked. Edit next month's draft instead.`);
}

// Returns the period for a month, creating it as a copy of the latest earlier one: that
// copy is how a month "locks on the 1st" — whatever draft exists becomes the budget, and
// if none was made, last month's budget carries over.
function ensurePeriod(month) {
  const found = db.periods.find(p => p.month === month);
  if (found) return found;
  if (month > addMonths(curMonth(), 1)) throw new Error('Budgets can only be created up to next month');
  const src = db.periods.filter(p => p.month < month).sort((a, b) => (a.month < b.month ? 1 : -1))[0];
  const p = { id: uid(), month, income: src?.income ?? 0, target_eomb: src?.target_eomb ?? 0 };
  db.periods.push(p);
  if (src) for (const i of db.items.filter(i => i.period_id === src.id)) {
    if (!db.categories.find(c => c.id === i.category_id)?.archived) db.items.push({ ...i, id: uid(), period_id: p.id });
  }
  saveDb();
  return p;
}

// `changed`: the debt's amount or kind changed. Otherwise an existing transaction keeps its
// lines, because backfilled AR can differ from what left the pocket (RAB is the source of
// truth for the AR amount, the sheet for the money) or be paid from two pockets.
function syncDebtTx(d, which, pocketId, changed = false) {
  const key = which + '_tx_id';
  const existing = d[key] && db.transactions.find(t => t.id === d[key]);
  const samePocket = pocketId === undefined || pocketId === existing?.lines[0]?.pocket_id;
  if (pocketId === undefined) pocketId = existing ? existing.lines[0].pocket_id : null;
  if (!pocketId) {
    if (existing) db.transactions = db.transactions.filter(t => t.id !== existing.id);
    d[key] = null;
    return;
  }
  // AR opens with money going out and settles with it coming back; AP is the reverse.
  const out = (d.kind === 'AR') === (which === 'open');
  const row = { date: which === 'open' ? d.date : d.settled_at, name: which === 'open' ? d.name : `Settled: ${d.name}`,
    category_id: debtCatId(db.categories, d.kind), lines: [{ id: uid(), pocket_id: pocketId, amount: out ? -d.amount : d.amount }] };
  if (existing && samePocket && !changed) Object.assign(existing, { ...row, lines: existing.lines });
  else if (existing) Object.assign(existing, row);
  else { const t = { id: uid(), created_at: stamp(), ...row }; db.transactions.push(t); d[key] = t.id; }
}

const tick = v => new Promise(res => setTimeout(() => res(clone(v)), 0));
const store = {
  async base() {
    loadDb();
    const bal = {};
    for (const t of db.transactions) for (const l of t.lines) bal[l.pocket_id] = (bal[l.pocket_id] || 0) + l.amount;
    return tick({ pockets: [...db.pockets].sort(bySort), categories: [...db.categories].sort(bySort), bal,
      debts: [...db.debts].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : byCreatedDesc(a, b))) });
  },
  async month(m) {
    const next = addMonths(m, 1);
    const rows = db.transactions.filter(t => t.date >= m && t.date < next)
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : byCreatedDesc(a, b)));
    return tick(rows.map(withNet));
  },
  // Latest movements of these pockets, each with the balance right after it. Transfers are
  // listed too, as income on the receiving pocket (kredit) and expense on the sending one
  // (debit). The amount is only what these pockets gained or lost, not the whole transaction,
  // so a transfer between two pockets of the same account nets to zero and is left out.
  async pocketActivity(pocketIds, limit = 10) {
    const rows = [];
    let running = db.transactions.reduce((s, t) => s + t.lines.filter(l => pocketIds.includes(l.pocket_id)).reduce((a, l) => a + l.amount, 0), 0);
    for (const t of [...db.transactions].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : byCreatedDesc(a, b)))) {
      const tx = withNet(t);
      const lines = tx.lines.filter(l => pocketIds.includes(l.pocket_id));
      const amount = lines.reduce((s, l) => s + l.amount, 0);
      const after = running;
      running -= amount;
      if (lines.length && amount) rows.push({ tx, amount, after });
      if (rows.length === limit) break;
    }
    return tick(rows);
  },
  async period(month) {
    const p = ensurePeriod(month);
    const items = db.items.filter(i => i.period_id === p.id).sort((a, b) => a.sort - b.sort)
      .map(i => ({ ...i, total: i.price * i.qty }));
    return tick({ ...p, items });
  },
  async saveTx({ id, date, name, category_id, lines }) {
    if (!lines.length) throw new Error('A transaction needs at least one pocket');
    const row = { date, name, category_id, lines: lines.map(l => ({ id: uid(), pocket_id: l.pocket_id, amount: l.amount })) };
    if (id) {
      const t = db.transactions.find(t => t.id === id);
      if (!t) throw new Error('Transaction not found');
      Object.assign(t, row);
    } else db.transactions.push({ id: uid(), created_at: stamp(), ...row });
    saveDb(); return tick(true);
  },
  async deleteTx(id) { db.transactions = db.transactions.filter(t => t.id !== id); saveDb(); return tick(true); },
  async savePocket(id, row) {
    if (id) Object.assign(db.pockets.find(p => p.id === id), row);
    else { id = uid(); db.pockets.push({ id, archived: false, sort: db.pockets.length, created_at: stamp(), ...row }); }
    saveDb(); return tick(id);
  },
  async saveCategory(id, row) {
    if (id) Object.assign(db.categories.find(c => c.id === id), row);
    else { id = uid(); db.categories.push({ id, archived: false, sort: db.categories.length, created_at: stamp(), ...row }); }
    saveDb(); return tick(id);
  },
  // Archive rather than delete: past transactions and locked budgets keep pointing at it.
  // It also leaves next month's draft, since budgeting a hidden category makes no sense.
  async archiveCategory(id, archived) {
    db.categories.find(c => c.id === id).archived = archived;
    if (archived) {
      const draft = ensurePeriod(addMonths(curMonth(), 1));
      db.items = db.items.filter(i => !(i.period_id === draft.id && i.category_id === id));
    }
    saveDb(); return tick(true);
  },
  async saveItem(periodId, id, row) {
    guardPeriod(periodId);
    if (id) Object.assign(db.items.find(i => i.id === id), row);
    else db.items.push({ id: uid(), period_id: periodId, sort: db.items.filter(i => i.period_id === periodId).length, ...row });
    saveDb(); return tick(true);
  },
  async deleteItem(item) { guardPeriod(item.period_id); db.items = db.items.filter(i => i.id !== item.id); saveDb(); return tick(true); },
  async savePeriod(id, row) { guardPeriod(id); Object.assign(db.periods.find(p => p.id === id), row); saveDb(); return tick(true); },
  // A debt can carry two transactions in the AR/AP categories: one when it is opened (AR: money
  // lent out of a pocket, AP: money received into one) and the reverse when it is settled.
  // pocketId: a pocket id, null for "no transaction", undefined to keep the current one.
  txPocket(id) { return (id && db.transactions.find(t => t.id === id)?.lines[0]?.pocket_id) || null; },
  async settleDebt(id, pocketId) {
    const d = db.debts.find(d => d.id === id);
    d.settled_at = today();
    syncDebtTx(d, 'settle', pocketId);
    saveDb(); return tick(true);
  },
  async unsettleDebt(id) {
    const d = db.debts.find(d => d.id === id);
    d.settled_at = null;
    syncDebtTx(d, 'settle', null);
    saveDb(); return tick(true);
  },
  async saveDebt(id, row, pocketId) {
    let d = id && db.debts.find(d => d.id === id);
    const changed = !d || d.amount !== row.amount || d.kind !== row.kind;
    if (d) Object.assign(d, row);
    else { d = { id: uid(), settled_at: null, open_tx_id: null, settle_tx_id: null, created_at: stamp(), ...row }; db.debts.push(d); }
    syncDebtTx(d, 'open', pocketId, changed);
    if (d.settle_tx_id) syncDebtTx(d, 'settle', undefined, changed);
    saveDb(); return tick(d.id);
  },
  async deleteDebt(id) {
    const d = db.debts.find(d => d.id === id);
    db.transactions = db.transactions.filter(t => t.id !== d.open_tx_id && t.id !== d.settle_tx_id);
    db.debts = db.debts.filter(d => d.id !== id);
    saveDb(); return tick(true);
  },
  reset() { lsDel(KEY); db = null; loadDb(); },
};

function totals(data) {
  // Like the sheet's Saldo Total (BCA → Ovo): sub-pockets such as Kos are set-aside money inside
  // an account, shown under "BCA Total" but not counted as spendable balance.
  const balance = data.pockets.filter(p => !p.archived && !p.parent_id).reduce((s, p) => s + (data.bal[p.id] || 0), 0);
  const open = k => data.debts.filter(d => d.kind === k && !d.settled_at).reduce((s, d) => s + d.amount, 0);
  return { balance, ar: open('AR'), ap: open('AP') };
}

// A transaction is a transfer when exactly one pocket gives and one receives, and the
// giver loses at least what the receiver gets — the difference is the admin fee.
function shape(lines) {
  const neg = lines.filter(l => l.amount < 0), pos = lines.filter(l => l.amount > 0);
  if (!pos.length) return { kind: 'out' };
  if (!neg.length) return { kind: 'in' };
  if (neg.length === 1 && pos.length === 1 && -neg[0].amount >= pos[0].amount)
    return { kind: 'transfer', from: neg[0], to: pos[0], fee: -neg[0].amount - pos[0].amount };
  return { kind: 'custom' };
}

// Usage per category: the sum of each transaction's net (negative for spending).
function usage(txs) {
  const used = {};
  for (const t of txs) if (t.category_id) used[t.category_id] = (used[t.category_id] || 0) + t.net;
  return used;
}

// ---- shell -----------------------------------------------------------------------------
function App() {
  return html`<${Main} />`;
}

let toastTimer;
function Main() {
  const [tab, setTab] = usePersisted('trax.tab', 'balance');
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [ver, setVer] = useState(0);
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState(null);
  toastFn = m => { setMsg(m); clearTimeout(toastTimer); toastTimer = setTimeout(() => setMsg(null), 3000); };

  useEffect(() => {
    let live = true;
    (async () => {
      try {
        const d = await store.base();
        if (live) { setData(d); setErr(null); }
      } catch (e) { if (live) setErr(e.message); }
    })();
    return () => { live = false; };
  }, [ver]);

  const reload = () => setVer(v => v + 1);
  const open = (type, props = {}) => setSheet({ type, props });
  const close = () => setSheet(null);
  const done = () => { setSheet(null); reload(); };

  if (!data) return html`<div class="center">
    ${err ? html`<b>Couldn't load</b><div class="mut" style="font-size:14px">${err}</div>
      <button class="secondary" onClick=${reload}>Try again</button>
      <button class="secondary" onClick=${() => { store.reset(); reload(); }}>Reset dummy data</button>`
    : html`<div class="mut">Loading…</div>`}</div>`;

  const ctx = { data, ver, open, reload };
  const tabs = [['balance', 'Balance', I.wallet], ['history', 'History', I.list], ['budget', 'Budget', I.pie], ['debt', 'AR/AP', I.swap]];
  const Screen = { balance: BalanceScreen, history: HistoryScreen, budget: BudgetScreen, debt: DebtScreen }[tab] || BalanceScreen;
  const Sheet = sheet && { proto: ProtoSheet, tx: TxSheet, pocket: PocketSheet, debt: DebtSheet, item: ItemSheet, period: PeriodSheet, category: CategorySheet }[sheet.type];

  return html`<div class="app">
    <${Screen} key=${today()} ...${ctx} />
    ${(tab === 'balance' || tab === 'history') && html`<button class="fab" aria-label="Add transaction" onClick=${() => open('tx')}><${Icon} d=${I.plus} size=${28} /></button>`}
    <nav class="tabbar">${tabs.map(([k, label, icon]) => html`
      <button key=${k} class=${'tab' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}><${Icon} d=${icon} />${label}</button>`)}
    </nav>
    ${Sheet && html`<${Sheet} ...${sheet.props} data=${data} open=${open} onClose=${close} onDone=${done} />`}
    ${msg && html`<div class="toast" onClick=${() => setMsg(null)}>${msg}</div>`}
  </div>`;
}

function Panel({ title, onClose, right, full, children, foot }) {
  return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose()}>
    <div class=${'panel' + (full ? ' full' : '')}>
      <div class="panel-head"><button class="link" style="text-align:left" onClick=${onClose}>Cancel</button>
        <b>${title}</b><span style="min-width:72px;text-align:right">${right}</span></div>
      <div class="panel-body">${children}</div>
      ${foot && html`<div class="foot">${foot}</div>`}
    </div></div>`;
}

const Seg = ({ value, options, onChange }) => html`<div class="seg">${options.map(([k, label]) =>
  html`<button key=${k} class=${value === k ? 'on' : ''} onClick=${() => onChange(k)}>${label}</button>`)}</div>`;

const Loading = () => html`<div class="empty">Loading…</div>`;

// ---- prototype controls ----------------------------------------------------------------
function ProtoSheet({ onClose, onDone }) {
  const [sim, setSim] = useState(lsGet(SIM_KEY) || '');
  const apply = v => { if (v) lsSet(SIM_KEY, v); else lsDel(SIM_KEY); onDone(); };
  return html`<${Panel} title="Prototype" onClose=${onClose}>
    <div class="note">Data is stored in this browser only (localStorage) and seeded with dummy data.</div>
    <div class="lbl">Simulated date</div>
    <div class="field"><span>Today</span><input type="date" value=${sim || iso(new Date())} onInput=${e => setSim(e.target.value)} /></div>
    <button class="secondary" onClick=${() => apply(sim)}>Use this date</button>
    ${lsGet(SIM_KEY) && html`<button class="secondary" onClick=${() => apply('')}>Back to the real date</button>`}
    <div class="note">To test the budget lock, jump to the 1st of next month: the draft becomes the active, locked budget.</div>
    <div class="lbl">Data</div>
    <button class="secondary danger" onClick=${() => { if (confirm('Delete all data and reseed with dummy data?')) { store.reset(); onDone(); } }}>Reset dummy data</button>
    <div class="note">Reset uses the active simulated date as "today".</div>
  <//>`;
}

// ---- Balance ---------------------------------------------------------------------------
function BalanceScreen({ data, open }) {
  const [mode, setMode] = usePersisted('trax.balanceMode', 'balance');
  const [showArchived, setShowArchived] = useState(false);
  const t = totals(data);
  const value = t.balance - (mode === 'ap' || mode === 'both' ? t.ap : 0) + (mode === 'ar' || mode === 'both' ? t.ar : 0);
  const active = data.pockets.filter(p => !p.archived);
  const archived = data.pockets.filter(p => p.archived);
  const kids = id => active.filter(p => p.parent_id === id);
  const bal = id => data.bal[id] || 0;

  const pocketRow = (p, sub) => html`<button key=${p.id} class=${'row' + (sub ? ' sub' : '')} onClick=${() => open('pocket', { pocket: p })}>
    <div class="row-main"><div class="row-title">${p.name}</div></div>
    <div class="row-amt num ${bal(p.id) < 0 ? 'neg' : ''}">${bal(p.id) < 0 ? '−' : ''}${fmt(bal(p.id))}</div></button>`;

  return html`<div class="screen">
    <div class="hero">
      <button class="proto-btn" onClick=${() => open('proto')}>Prototype${lsGet(SIM_KEY) ? ' · ' + dayLabel(today()) : ''}</button>
      <div class="hero-label">Total balance</div>
      <div class="hero-num num">${value < 0 ? '−' : ''}Rp ${fmt(value)}</div>
      <div class="pills">${[['balance', 'Balance'], ['ap', '− AP'], ['ar', '+ AR'], ['both', '− AP + AR']].map(([k, label]) =>
        html`<button key=${k} class=${'pill' + (mode === k ? ' on' : '')} onClick=${() => setMode(k)}>${label}</button>`)}</div>
    </div>
    <div class="section-h"><span>Pockets</span></div>
    ${active.filter(p => !p.parent_id || !active.some(x => x.id === p.parent_id)).map(p => {
      const children = kids(p.id);
      if (!children.length) return html`<div class="card" key=${p.id}>${pocketRow(p)}</div>`;
      const sum = bal(p.id) + children.reduce((s, c) => s + bal(c.id), 0);
      return html`<div class="card" key=${p.id}>
        <button class="row" onClick=${() => open('pocket', { pocket: p, ids: [p.id, ...children.map(c => c.id)], title: p.name + ' Total' })}>
          <div class="row-main"><div class="row-title" style="font-weight:600">${p.name} Total</div></div>
          <div class="row-amt num">${fmt(sum)}</div></button>
        ${pocketRow(p, true)}${children.map(c => pocketRow(c, true))}</div>`;
    })}
    <div class="card"><button class="add" onClick=${() => open('pocket', {})}><${Icon} d=${I.plus} size=${18} />New pocket</button></div>
    ${archived.length > 0 && html`
      <button class="note" onClick=${() => setShowArchived(!showArchived)}>${showArchived ? 'Hide' : 'Show'} ${archived.length} archived pocket${archived.length > 1 ? 's' : ''}</button>
      ${showArchived && html`<div class="card">${archived.map(p => pocketRow(p))}</div>`}`}
  </div>`;
}

// Tapping a pocket shows its latest spending; "Edit" switches to the settings form. The
// account total row passes every pocket of the account in `ids` and has no settings.
function PocketSheet(props) {
  const { pocket, ids, title, onClose, open } = props;
  const [editing, setEditing] = useState(!pocket);
  const [rows, setRows] = useState(null);
  useEffect(() => {
    if (!pocket) return;
    store.pocketActivity(ids ?? [pocket.id]).then(setRows).catch(e => toast(e.message));
  }, []);
  if (editing) return html`<${PocketForm} ...${props} />`;

  return html`<${Panel} title=${title ?? pocket.name} onClose=${onClose}
    right=${!ids && html`<button class="link" onClick=${() => setEditing(true)}>Edit</button>`}>
    <div class="lbl" style="margin-top:4px">Last 10 transactions</div>
    ${!rows ? html`<${Loading} />` : !rows.length ? html`<div class="empty">No transactions yet.</div>`
      : html`<div class="card" style="margin-top:0">
        <div class="row activity-head"><span class="row-main">Transaction</span><span>Amount</span><span>Balance after</span></div>
        ${rows.map(({ tx, amount, after }) => html`
        <button class="row activity" key=${tx.id} onClick=${() => open('tx', { tx })}>
          <div class="row-main"><div class="row-title">${tx.name}</div><div class="row-sub">${dayLabel(tx.date)}</div></div>
          <div class="row-amt num ${amount > 0 ? 'pos' : ''}">${fmtSigned(amount)}</div>
          <div class="row-amt num mut">${after < 0 ? '−' : ''}${fmt(after)}</div></button>`)}</div>`}
  <//>`;
}

function PocketForm({ data, pocket, onClose, onDone }) {
  const isNew = !pocket;
  const [name, setName] = useState(pocket?.name ?? '');
  const [parent, setParent] = useState(pocket?.parent_id ?? '');
  const [target, setTarget] = useState('');
  const [busy, setBusy] = useState(false);
  const bal = pocket ? data.bal[pocket.id] || 0 : 0;
  const hasKids = pocket && data.pockets.some(p => p.parent_id === pocket.id && !p.archived);
  const parents = data.pockets.filter(p => !p.archived && !p.parent_id && p.id !== pocket?.id);

  const save = async () => {
    if (!name.trim()) return toast('Pocket name is required');
    setBusy(true);
    try {
      const row = { name: name.trim(), parent_id: parent || null };
      let id = pocket?.id;
      id = await store.savePocket(id, row);
      // Setting a balance records the difference as a transaction, so history still adds up.
      if (target !== '') {
        const diff = Math.round((Number(target) - bal) * 100) / 100;
        if (diff) await store.saveTx({ id: null, date: today(), name: isNew ? 'Opening balance' : 'Balance adjustment',
          category_id: null, lines: [{ pocket_id: id, amount: diff }] });
      }
      onDone();
    } catch (e) { toast(e.message); setBusy(false); }
  };
  const toggleArchive = async () => {
    try { await store.savePocket(pocket.id, { archived: !pocket.archived }); onDone(); }
    catch (e) { toast(e.message); }
  };

  return html`<${Panel} title=${isNew ? 'New pocket' : pocket.name} onClose=${onClose}
    right=${html`<button class="link" disabled=${busy} onClick=${save}>Save</button>`}>
    <div class="field"><span>Name</span><input value=${name} onInput=${e => setName(e.target.value)} /></div>
    ${!hasKids && html`<div class="field"><span>Part of account</span>
      <select value=${parent} onChange=${e => setParent(e.target.value)}>
        <option value="">— None —</option>${parents.map(p => html`<option value=${p.id}>${p.name}</option>`)}</select></div>`}
    <div class="lbl">Balance</div>
    ${!isNew && html`<div class="field"><span>Current balance</span><b class="num">${bal < 0 ? '−' : ''}${fmt(bal)}</b></div>`}
    <div class="field"><span>${isNew ? 'Opening balance' : 'Set balance to'}</span>
      <input inputmode="numeric" placeholder=${isNew ? '0' : 'leave empty'} value=${target === '' ? '' : fmt(target)}
        onInput=${e => setTarget(digits(e.target.value))} /></div>
    ${!isNew && html`<button class="secondary ${pocket.archived ? '' : 'danger'}" style="margin-top:20px" onClick=${toggleArchive}>
      ${pocket.archived ? 'Restore pocket' : 'Archive pocket'}</button>`}
  <//>`;
}

// ---- History ---------------------------------------------------------------------------
function HistoryScreen({ data, ver, open }) {
  const [month, setMonth] = useState(curMonth());
  const [txs, setTxs] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let live = true;
    setTxs(null); setErr(null);
    store.month(month).then(r => live && setTxs(r)).catch(e => live && setErr(e.message));
    return () => { live = false; };
  }, [month, ver]);

  const cat = id => data.categories.find(c => c.id === id);
  const pName = id => data.pockets.find(p => p.id === id)?.name ?? '?';
  const groups = useMemo(() => {
    const g = new Map();
    for (const t of txs || []) { if (!g.has(t.date)) g.set(t.date, []); g.get(t.date).push(t); }
    return [...g];
  }, [txs]);

  let spent = 0, earned = 0;
  for (const t of txs || []) {
    const c = cat(t.category_id);
    if (!c) continue;
    if (c.kind === 'income') earned += t.net;
    else if (c.kind === 'expense') spent -= t.net;
  }

  const txRow = t => {
    const s = shape(t.lines);
    const c = cat(t.category_id);
    const pockets = s.kind === 'transfer' ? `${pName(s.from.pocket_id)} → ${pName(s.to.pocket_id)}`
      : [...new Set(t.lines.map(l => pName(l.pocket_id)))].join(' + ');
    const amt = s.kind === 'transfer'
      ? html`<div class="row-amt num mut">${fmt(s.to.amount)}${s.fee > 0 && html`<small>fee ${fmt(s.fee)}</small>`}</div>`
      : html`<div class="row-amt num ${t.net > 0 ? 'pos' : ''}">${fmtSigned(t.net)}</div>`;
    return html`<button key=${t.id} class="row" onClick=${() => open('tx', { tx: t })}>
      <div class="row-main"><div class="row-title">${t.name}</div>
        <div class="row-sub">${c ? c.name : html`<span class="dim">${s.kind === 'transfer' ? 'Transfer' : 'Adjustment'}</span>`} · ${pockets}</div></div>${amt}</button>`;
  };

  return html`<div class="screen">
    <div class="title"><span>${monthLabel(month)}</span>
      <span class="month-nav">
        <button class="icon-btn" aria-label="Previous month" onClick=${() => setMonth(addMonths(month, -1))}><${Icon} d=${I.left} /></button>
        <button class="icon-btn" aria-label="Next month" disabled=${month >= curMonth()} style=${month >= curMonth() ? 'opacity:.3' : ''}
          onClick=${() => setMonth(addMonths(month, 1))}><${Icon} d=${I.right} /></button></span></div>
    <div class="card"><div class="stat"><span class="mut">Spent</span><b class="num">${fmt(spent)}</b></div>
      <div class="stat"><span class="mut">Income</span><b class="num pos">${fmt(earned)}</b></div></div>
    ${err ? html`<div class="empty neg">${err}</div>` : !txs ? html`<${Loading} />`
      : !txs.length ? html`<div class="empty">No transactions in ${monthLabel(month)} yet.</div>`
      : groups.map(([date, list]) => {
        const dayOut = list.filter(t => t.net < 0 && shape(t.lines).kind !== 'transfer').reduce((s, t) => s - t.net, 0);
        return html`<div key=${date}><div class="section-h"><span>${dayLabel(date)}</span>${dayOut > 0 && html`<span class="num">−${fmt(dayOut)}</span>`}</div>
          <div class="card">${list.map(txRow)}</div></div>`;
      })}
  </div>`;
}

// ---- transaction input -----------------------------------------------------------------
const amtStr = n => { const r = Math.round(Math.abs(n) * 100) / 100; return r ? String(r) : ''; };
const num = s => Number(s || 0);

function newForm(data) {
  const active = data.pockets.filter(p => !p.archived);
  const last = lsGet('trax.lastPocket');
  const def = active.some(p => p.id === last) ? last : active[0]?.id ?? '';
  return { id: null, date: today(), name: '', categoryId: othersId(data.categories, 'expense'), kind: 'out',
    lines: [{ pocketId: def, amt: '', sign: -1 }], from: def, to: '', tamt: '', fee: '', active: 'l0' };
}

function formFromTx(tx) {
  const s = shape(tx.lines);
  const f = { id: tx.id, date: tx.date, name: tx.name, categoryId: tx.category_id, from: '', to: '', tamt: '', fee: '', active: 'l0',
    lines: tx.lines.map(l => ({ pocketId: l.pocket_id, amt: amtStr(l.amount), sign: Math.sign(l.amount) })) };
  if (s.kind === 'transfer')
    return { ...f, kind: 'transfer', from: s.from.pocket_id, to: s.to.pocket_id, tamt: amtStr(s.to.amount), fee: amtStr(s.fee), active: 'tamt' };
  return { ...f, kind: s.kind };
}

const getAmt = (f, key) => key[0] === 'l' ? f.lines[Number(key.slice(1))]?.amt : f[key];
const setAmt = (f, key, v) => key[0] === 'l'
  ? { ...f, lines: f.lines.map((l, i) => i === Number(key.slice(1)) ? { ...l, amt: v } : l) }
  : { ...f, [key]: v };

function pressKey(f, k) {
  let v = getAmt(f, f.active);
  if (v == null) return f;
  if (v.includes('.')) v = String(Math.round(Number(v)));
  if (k === 'del') v = v.slice(0, -1);
  else { v = (v + k).replace(/^0+/, ''); if (v.length > 12) return f; }
  return setAmt(f, f.active, v);
}

function buildLines(f) {
  let lines;
  if (f.kind === 'transfer') {
    if (!f.from || !f.to) return { error: 'Choose both pockets' };
    if (f.from === f.to) return { error: 'From and to are the same pocket' };
    lines = [{ pocket_id: f.from, amount: -(num(f.tamt) + num(f.fee)) }, { pocket_id: f.to, amount: num(f.tamt) }];
  } else {
    const sign = f.kind === 'out' ? -1 : 1;
    lines = f.lines.map(l => ({ pocket_id: l.pocketId, amount: (f.kind === 'custom' ? l.sign : sign) * num(l.amt) }));
  }
  lines = lines.filter(l => l.amount !== 0);
  if (!lines.length) return { error: 'Enter an amount' };
  if (lines.some(l => !l.pocket_id)) return { error: 'Choose a pocket' };
  return { lines };
}

function TxSheet({ data, tx, onClose, onDone }) {
  const [f, setF] = useState(() => tx ? formFromTx(tx) : newForm(data));
  const [busy, setBusy] = useState(false);
  const up = patch => setF(s => ({ ...s, ...(typeof patch === 'function' ? patch(s) : patch) }));
  const pockets = data.pockets.filter(p => !p.archived || f.lines.some(l => l.pocketId === p.id) || p.id === f.from || p.id === f.to);
  const pName = id => data.pockets.find(p => p.id === id)?.name ?? '';

  const setKind = kind => up(s => {
    const lines = s.lines.length ? s.lines : [{ pocketId: s.from, amt: '', sign: -1 }];
    const signed = s.kind === 'out' || s.kind === 'in' ? lines.map(l => ({ ...l, sign: s.kind === 'out' ? -1 : 1 })) : lines;
    const c = data.categories.find(c => c.id === s.categoryId);
    // Transfers carry no category: moving money between pockets is not spending.
    const keepCat = c && (c.kind === 'debt' ? kind !== 'transfer' : kind === 'out' ? c.kind === 'expense' : kind === 'in' ? c.kind === 'income' : kind === 'custom');
    const fallback = kind === 'out' ? othersId(data.categories, 'expense') : kind === 'in' ? othersId(data.categories, 'income') : null;
    return { kind, lines: signed, categoryId: keepCat ? s.categoryId : fallback, from: s.from || lines[0].pocketId,
      tamt: s.tamt || (kind === 'transfer' ? lines[0].amt : ''), active: kind === 'transfer' ? 'tamt' : 'l0' };
  });

  const cats = data.categories.filter(c => !c.archived || c.id === f.categoryId)
    .filter(c => (c.kind === 'debt' ? c.id === f.categoryId : f.kind === 'out' ? c.kind === 'expense' : f.kind === 'in' ? c.kind === 'income' : true));

  const save = async () => {
    const { lines, error } = buildLines(f);
    if (error) return toast(error);
    // Transfers are named from their pockets; there is nothing to type.
    const name = f.kind === 'transfer' ? `Top up from ${pName(f.from)} to ${pName(f.to)}` : f.name.trim();
    if (!name) return toast('Enter a name');
    setBusy(true);
    try {
      const category_id = f.kind === 'transfer' ? null
        : f.categoryId ?? (f.kind === 'in' ? othersId(data.categories, 'income') : f.kind === 'out' ? othersId(data.categories, 'expense') : null);
      await store.saveTx({ id: f.id, date: f.date, name, category_id, lines });
      lsSet('trax.lastPocket', lines.find(l => l.amount < 0)?.pocket_id ?? lines[0].pocket_id);
      onDone();
    } catch (e) { toast(e.message); setBusy(false); }
  };
  const remove = async () => {
    if (!confirm(`Delete "${f.name}"?`)) return;
    try { await store.deleteTx(f.id); onDone(); } catch (e) { toast(e.message); }
  };

  const amtBtn = k => html`<button class=${'amt-field num' + (f.active === k ? ' on' : '')}
    onClick=${() => { document.activeElement?.blur(); up({ active: k }); }}>${getAmt(f, k) ? fmt(getAmt(f, k)) : html`<span class="dim">0</span>`}</button>`;
  const pocketSelect = (value, onChange, placeholder) => html`<select value=${value} onChange=${e => onChange(e.target.value)}>
    ${placeholder && html`<option value="">${placeholder}</option>`}${pockets.map(p => html`<option value=${p.id}>${p.name}</option>`)}</select>`;
  const setLine = (i, patch) => up(s => ({ lines: s.lines.map((l, j) => j === i ? { ...l, ...patch } : l) }));
  const addLine = sign => up(s => ({ lines: [...s.lines, { pocketId: '', amt: '', sign }], active: 'l' + s.lines.length }));
  const dropLine = i => up(s => ({ lines: s.lines.filter((_, j) => j !== i), active: 'l0' }));

  // One page for every type: the big number is what the keypad types into, the type is a
  // radio row like the category chips, and the pocket area below adapts to the type.
  const single = (f.kind === 'out' || f.kind === 'in') && f.lines.length === 1;
  const bigKey = f.kind === 'transfer' ? 'tamt' : single ? 'l0' : null;
  const lineTotal = f.lines.reduce((s, l) => s + (f.kind === 'custom' ? l.sign : f.kind === 'out' ? -1 : 1) * num(l.amt), 0);
  const bigValue = bigKey ? getAmt(f, bigKey) : Math.abs(lineTotal);
  const pocketChips = (value, onPick) => html`<div class="chips">${pockets.filter(p => !p.archived).map(p => html`<button key=${p.id}
    class=${'chip' + (value === p.id ? ' on' : '')} onClick=${() => onPick(p.id)}>${p.name}</button>`)}${single && html`
    <button class="chip ghost" onClick=${() => addLine(f.kind === 'out' ? -1 : 1)}>+ Split</button>`}</div>`;

  let pocketArea;
  if (single) {
    pocketArea = html`<div class="lbl">Pocket</div>${pocketChips(f.lines[0].pocketId, id => setLine(0, { pocketId: id }))}`;
  } else if (f.kind === 'transfer') {
    pocketArea = html`
      <div class="lbl">From</div>${pocketChips(f.from, id => up({ from: id }))}
      <div class="lbl">To</div>${pocketChips(f.to, id => up({ to: id }))}
      <div class="field"><span>Admin fee</span>${amtBtn('fee')}</div>`;
  } else {
    pocketArea = html`<div class="lbl">Pockets</div>
      ${f.lines.map((l, i) => html`<div class="line" key=${i}>
        ${f.kind === 'custom' && html`<button class=${'sign ' + (l.sign < 0 ? 'neg' : 'pos')} onClick=${() => setLine(i, { sign: -l.sign })}>${l.sign < 0 ? '−' : '+'}</button>`}
        ${pocketSelect(l.pocketId, v => setLine(i, { pocketId: v }), 'Pocket')}
        ${amtBtn('l' + i)}
        ${f.lines.length > 1 && html`<button class="x" aria-label="Remove line" onClick=${() => dropLine(i)}>×</button>`}</div>`)}
      <div class="line"><button class="chip ghost" onClick=${() => addLine(f.kind === 'in' ? 1 : -1)}>+ Pocket</button></div>`;
  }

  return html`<${Panel} full title=${f.id ? 'Edit transaction' : 'New transaction'} onClose=${onClose}
    right=${f.id && html`<button class="link danger" onClick=${remove}>Delete</button>`}
    foot=${html`
      <div class="keypad" style="padding:0 0 8px">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '000', '0', 'del'].map(k => html`
        <button key=${k} class="key num" aria-label=${k === 'del' ? 'Backspace' : k} onClick=${() => setF(s => pressKey(s, k))}>
          ${k === 'del' ? html`<${Icon} d=${I.del} />` : k}</button>`)}</div>
      <button class="primary" disabled=${busy} onClick=${save}>${busy ? 'Saving…' : 'Save'}</button>`}>
    <button class=${'big num kind-' + f.kind + (bigKey && f.active !== bigKey ? ' idle' : '')} onClick=${() => { document.activeElement?.blur(); if (bigKey) up({ active: bigKey }); }}>
      <span class="rp">Rp</span>${bigValue ? fmt(bigValue) : html`<span class="dim">0</span>`}</button>
    ${!bigKey && html`<div class="note" style="justify-content:center;margin-top:0">${f.kind === 'custom' ? 'Net' : 'Total'} of the lines below</div>`}
    <div class="lbl">Type</div>
    <div class="chips">${[['out', 'Expense'], ['in', 'Income'], ['transfer', 'Transfer'], ...(f.kind === 'custom' ? [['custom', 'Custom']] : [])].map(([k, label]) => html`
      <button key=${k} class=${'chip kind-chip kind-' + k + (f.kind === k ? ' on' : '')} onClick=${() => setKind(k)}>${label}</button>`)}</div>
    ${pocketArea}
    ${f.kind !== 'transfer' && html`<div class="lbl">Name</div>
    <input class="input" value=${f.name}
      onInput=${e => up({ name: e.target.value })} enterkeyhint="done" onKeyDown=${e => e.key === 'Enter' && e.target.blur()} />
`}
    <div class="lbl">Date</div>
    <div class="chips"><label class="chip on">${dayLabel(f.date)}
      <input type="date" value=${f.date} onInput=${e => e.target.value && up({ date: e.target.value })} /></label>
      ${f.date !== today() && html`<button class="chip" onClick=${() => up({ date: today() })}>Today</button>`}</div>
    ${f.kind !== 'transfer' && html`<div class="lbl">Category</div>
    <div class="chips">
      ${cats.map(c => html`<button key=${c.id} class=${'chip' + (f.categoryId === c.id ? ' on' : '')} onClick=${() => up({ categoryId: c.id })}>${c.name}</button>`)}</div>`}
  <//>`;
}

// ---- Budget ----------------------------------------------------------------------------
function BudgetScreen(ctx) {
  const [view, setView] = usePersisted('trax.budgetView', 'now');
  const next = addMonths(curMonth(), 1);
  return html`<div class="screen">
    <div class="title"><span>Budget</span></div>
    <${Seg} value=${view} onChange=${setView} options=${[['now', parseISO(curMonth()).toLocaleDateString('en-GB', { month: 'short' }) + ' (active)'],
      ['next', parseISO(next).toLocaleDateString('en-GB', { month: 'short' }) + ' (draft)'], ['cats', 'Categories']]} />
    ${view === 'next' ? html`<${BudgetDraft} ...${ctx} />` : view === 'cats' ? html`<${Categories} ...${ctx} />` : html`<${BudgetNow} ...${ctx} />`}
  </div>`;
}

function BudgetNow({ data, ver }) {
  const [state, setState] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let live = true;
    Promise.all([store.period(curMonth()), store.month(curMonth())])
      .then(([period, txs]) => live && setState({ period, txs })).catch(e => live && setErr(e.message));
    return () => { live = false; };
  }, [ver]);
  if (err) return html`<div class="empty neg">${err}</div>`;
  if (!state) return html`<${Loading} />`;

  const { period, txs } = state;
  const used = usage(txs);
  const cat = id => data.categories.find(c => c.id === id);
  const t = totals(data);
  const items = period.items.map(i => ({ ...i, spent: -(used[i.category_id] || 0) }));
  const budgeted = new Set(items.map(i => i.category_id));
  const outside = Object.entries(used).filter(([id, v]) => !budgeted.has(id) && cat(id)?.kind === 'expense' && v < 0);
  const received = Object.entries(used).filter(([id]) => cat(id)?.kind === 'income').reduce((s, [, v]) => s + v, 0);
  const totalBudget = items.reduce((s, i) => s + i.total, 0);
  const totalSpent = items.reduce((s, i) => s + i.spent, 0);
  // Mirrors the sheet's Expected EOMB: what is left to spend is still to leave the balance,
  // what is left to receive is still to arrive. Overspent lines count as zero remaining.
  const expLeft = items.reduce((s, i) => s + Math.max(0, i.total - i.spent), 0);
  const incomeLeft = Math.max(0, period.income - received);
  const expected = t.balance + incomeLeft + t.ar - expLeft - t.ap;
  const cond = expected - period.target_eomb;

  return html`
    <div class="note"><${Icon} d=${I.lock} size=${14} />Locked since 1 ${monthLabel(curMonth())}. Changes go into next month's draft.</div>
    <div class="card">
      <div class="stat"><span class="mut">Projected end of month</span><b class="num">${expected < 0 ? '−' : ''}${fmt(expected)}</b></div>
      <div class="stat"><span class="mut">Target</span><span class="num">${fmt(period.target_eomb)}</span></div>
      <div class="stat total"><span>${cond >= 0 ? 'On track' : 'Short'}</span><span class=${'num ' + (cond >= 0 ? 'pos' : 'neg')}>${fmtSigned(cond)}</span></div>
    </div>
    <div class="card">
      <div class="stat"><span class="mut">Balance</span><span class="num">${fmt(t.balance)}</span></div>
      <div class="stat"><span class="mut">+ Income still due</span><span class="num">${fmt(incomeLeft)}</span></div>
      <div class="stat"><span class="mut">+ AR</span><span class="num">${fmt(t.ar)}</span></div>
      <div class="stat"><span class="mut">− Budget left to spend</span><span class="num">${fmt(expLeft)}</span></div>
      <div class="stat"><span class="mut">− AP</span><span class="num">${fmt(t.ap)}</span></div>
    </div>
    <div class="section-h"><span>Spending</span><span class="num">${fmt(totalSpent)} / ${fmt(totalBudget)}</span></div>
    ${!items.length ? html`<div class="card"><div class="empty">No budget for this month. Build one in the draft tab — it takes effect next month.</div></div>`
      : html`<div class="card">${items.map(i => {
        const left = i.total - i.spent;
        return html`<div class="row" key=${i.id} style="display:block">
          <div style="display:flex;justify-content:space-between;gap:12px"><span class="row-title">${cat(i.category_id)?.name ?? '?'}</span>
            <span class="num ${left < 0 ? 'neg' : 'mut'}" style="font-size:14px">${left < 0 ? fmt(left) + ' over' : fmt(left) + ' left'}</span></div>
          <div class="bar ${left < 0 ? 'over' : ''}"><i style=${`width:${i.total ? Math.min(100, (i.spent / i.total) * 100) : i.spent > 0 ? 100 : 0}%`}></i></div>
          <div class="row-sub num">${fmt(i.spent)} of ${fmt(i.total)}</div></div>`;
      })}</div>`}
    ${outside.length > 0 && html`<div class="section-h"><span>Outside the budget</span></div>
      <div class="card">${outside.map(([id, v]) => html`<div class="row" key=${id}><div class="row-main">${cat(id).name}</div>
        <div class="row-amt num">${fmt(v)}</div></div>`)}</div>`}
    <div class="section-h"><span>Income</span><span class="num">${fmt(received)} / ${fmt(period.income)}</span></div>`;
}

function BudgetDraft({ data, ver, open }) {
  const month = addMonths(curMonth(), 1);
  const [period, setPeriod] = useState(null);
  const [err, setErr] = useState(null);
  useEffect(() => {
    let live = true;
    store.period(month).then(p => live && setPeriod(p)).catch(e => live && setErr(e.message));
    return () => { live = false; };
  }, [ver]);
  if (err) return html`<div class="empty neg">${err}</div>`;
  if (!period) return html`<${Loading} />`;

  const cat = id => data.categories.find(c => c.id === id);
  const total = period.items.reduce((s, i) => s + i.total, 0);
  return html`
    <div class="note">Takes effect on 1 ${monthLabel(month)}, then locks.</div>
    <div class="card">
      <button class="row" onClick=${() => open('period', { period })}><div class="row-main">Income</div><div class="row-amt num">${fmt(period.income)}</div></button>
      <div class="row"><div class="row-main mut">Total budget</div><div class="row-amt num">${fmt(total)}</div></div>
      <div class="row"><div class="row-main mut">Target saving</div><div class="row-amt num ${period.income - total < 0 ? 'neg' : 'pos'}">${fmtSigned(period.income - total)}</div></div>
      <button class="row" onClick=${() => open('period', { period })}><div class="row-main">Target end-of-month balance</div><div class="row-amt num">${fmt(period.target_eomb)}</div></button>
    </div>
    <div class="section-h"><span>Budget lines</span></div>
    <div class="card">
      ${period.items.map(i => html`<button class="row" key=${i.id} onClick=${() => open('item', { period, item: i })}>
        <div class="row-main"><div class="row-title">${cat(i.category_id)?.name ?? '?'}</div>
          <div class="row-sub num">${fmt(i.price)} × ${i.qty} ${i.unit}</div></div>
        <div class="row-amt num">${fmt(i.total)}</div></button>`)}
      <button class="add" onClick=${() => open('item', { period })}><${Icon} d=${I.plus} size=${18} />Add line</button>
    </div>`;
}

function ItemSheet({ data, period, item, onClose, onDone }) {
  const free = data.categories.filter(c => c.kind === 'expense' && !c.archived && !period.items.some(i => i.category_id === c.id));
  const [catId, setCatId] = useState(item?.category_id ?? (free[0]?.id || '__new'));
  const [newName, setNewName] = useState('');
  const [price, setPrice] = useState(item ? String(item.price) : '');
  const [unit, setUnit] = useState(item?.unit ?? 'Month');
  const [qty, setQty] = useState(item ? String(item.qty) : '1');
  const [busy, setBusy] = useState(false);

  const save = async () => {
    if (catId === '__new' && !newName.trim()) return toast('Enter a category name');
    setBusy(true);
    try {
      const row = { price: num(price), unit, qty: Number(qty) || 0 };
      if (item) await store.saveItem(period.id, item.id, row);
      else {
        const category_id = catId === '__new' ? await store.saveCategory(null, { name: newName.trim(), kind: 'expense' }) : catId;
        await store.saveItem(period.id, null, { ...row, category_id });
      }
      onDone();
    } catch (e) { toast(e.message); setBusy(false); }
  };
  const remove = async () => {
    try { await store.deleteItem(item); onDone(); } catch (e) { toast(e.message); }
  };

  return html`<${Panel} title=${item ? data.categories.find(c => c.id === item.category_id)?.name : 'Add line'} onClose=${onClose}
    right=${html`<button class="link" disabled=${busy} onClick=${save}>Save</button>`}>
    ${!item && html`<div class="field"><span>Category</span><select value=${catId} onChange=${e => setCatId(e.target.value)}>
      ${free.map(c => html`<option value=${c.id}>${c.name}</option>`)}<option value="__new">+ New category</option></select></div>
      ${catId === '__new' && html`<div class="field"><span>Category name</span><input value=${newName} onInput=${e => setNewName(e.target.value)} /></div>`}`}
    <div class="field"><span>Price</span><input inputmode="numeric" placeholder="0" value=${price ? fmt(price) : ''} onInput=${e => setPrice(digits(e.target.value))} /></div>
    <div class="field"><span>Unit</span><select value=${unit} onChange=${e => setUnit(e.target.value)}>${UNITS.map(u => html`<option>${u}</option>`)}</select></div>
    <div class="field"><span>Quantity</span><input inputmode="decimal" value=${qty} onInput=${e => setQty(e.target.value.replace(',', '.').replace(/[^\d.]/g, ''))} /></div>
    <div class="field"><span>Total</span><b class="num">${fmt(num(price) * (Number(qty) || 0))}</b></div>
    ${item && html`<button class="secondary danger" style="margin-top:20px" onClick=${remove}>Remove from budget</button>`}
  <//>`;
}

function PeriodSheet({ period, onClose, onDone }) {
  const [income, setIncome] = useState(String(period.income));
  const [target, setTarget] = useState(String(period.target_eomb));
  const save = async () => {
    try { await store.savePeriod(period.id, { income: num(income), target_eomb: num(target) }); onDone(); }
    catch (e) { toast(e.message); }
  };
  return html`<${Panel} title=${'Budget ' + monthLabel(period.month)} onClose=${onClose}
    right=${html`<button class="link" onClick=${save}>Save</button>`}>
    <div class="field"><span>Income</span><input inputmode="numeric" value=${income ? fmt(income) : ''} placeholder="0" onInput=${e => setIncome(digits(e.target.value))} /></div>
    <div class="field"><span>Target end-of-month balance</span><input inputmode="numeric" value=${target ? fmt(target) : ''} placeholder="0" onInput=${e => setTarget(digits(e.target.value))} /></div>
  <//>`;
}

function Categories({ data, open }) {
  const [showArchived, setShowArchived] = useState(false);
  const list = kind => data.categories.filter(c => c.kind === kind && !c.archived);
  const archived = data.categories.filter(c => c.archived);
  const rows = cs => cs.map(c => html`<button class="row" key=${c.id} onClick=${() => open('category', { category: c })}>
    <div class="row-main ${c.archived ? 'mut' : ''}">${c.name}</div></button>`);
  return html`
    <div class="section-h"><span>Expense</span></div>
    <div class="card">${rows(list('expense'))}
      <button class="add" onClick=${() => open('category', { kind: 'expense' })}><${Icon} d=${I.plus} size=${18} />Expense category</button></div>
    <div class="section-h"><span>Income</span></div>
    <div class="card">${rows(list('income'))}
      <button class="add" onClick=${() => open('category', { kind: 'income' })}><${Icon} d=${I.plus} size=${18} />Income category</button></div>
    ${archived.length > 0 && html`<button class="note" onClick=${() => setShowArchived(!showArchived)}>${showArchived ? 'Hide' : 'Show'} ${archived.length} archived categor${archived.length > 1 ? 'ies' : 'y'}</button>
      ${showArchived && html`<div class="card">${rows(archived)}</div>`}`}`;
}

function CategorySheet({ category, kind: kind0, onClose, onDone }) {
  const [name, setName] = useState(category?.name ?? '');
  const [kind, setKind] = useState(category?.kind ?? kind0 ?? 'expense');
  const save = async () => {
    if (!name.trim()) return toast('Category name is required');
    try {
      await store.saveCategory(category?.id ?? null, { name: name.trim(), kind });
      onDone();
    } catch (e) { toast(e.message); }
  };
  const toggleArchive = async () => {
    try { await store.archiveCategory(category.id, !category.archived); onDone(); } catch (e) { toast(e.message); }
  };
  return html`<${Panel} title=${category ? 'Edit category' : 'New category'} onClose=${onClose}
    right=${html`<button class="link" onClick=${save}>Save</button>`}>
    <div class="field"><span>Name</span><input value=${name} onInput=${e => setName(e.target.value)} /></div>
    <div style="margin-top:8px"><${Seg} value=${kind} onChange=${setKind} options=${[['expense', 'Expense'], ['income', 'Income']]} /></div>
    ${category && html`<button class="secondary ${category.archived ? '' : 'danger'}" style="margin-top:20px" onClick=${toggleArchive}>
      ${category.archived ? 'Restore category' : 'Archive category'}</button>
      <div class="note">Renaming applies to past transactions too. Archiving hides the category from input and removes it from next month's draft.</div>`}
  <//>`;
}

// ---- AR / AP ---------------------------------------------------------------------------
function DebtScreen({ data, open }) {
  const [kind, setKind] = usePersisted('trax.debtKind', 'AR');
  const [showSettled, setShowSettled] = useState(false);
  const items = data.debts.filter(d => d.kind === kind);
  const openItems = items.filter(d => !d.settled_at);
  const settled = items.filter(d => d.settled_at);
  const row = d => html`<button class="row" key=${d.id} onClick=${() => open('debt', { debt: d })}>
    <div class="row-main"><div class="row-title ${d.settled_at ? 'mut' : ''}">${d.name}</div>
      <div class="row-sub">${dayLabel(d.date)}${d.settled_at ? ' · settled ' + dayLabel(d.settled_at) : ''}</div></div>
    <div class="row-amt num ${d.settled_at ? 'mut' : ''}">${fmt(d.amount)}</div></button>`;
  return html`<div class="screen">
    <div class="title"><span>AR & AP</span></div>
    <${Seg} value=${kind} onChange=${setKind} options=${[['AR', 'Receivables'], ['AP', 'Payables']]} />
    <div class="hero"><div class="hero-label">${kind === 'AR' ? 'Owed to you' : 'Owed to others'}</div>
      <div class="hero-num num">Rp ${fmt(openItems.reduce((s, d) => s + d.amount, 0))}</div></div>
    <div class="card">${openItems.map(row)}
      <button class="add" onClick=${() => open('debt', { kind })}><${Icon} d=${I.plus} size=${18} />Add ${kind === 'AR' ? 'receivable' : 'payable'}</button></div>
    ${settled.length > 0 && html`<button class="note" onClick=${() => setShowSettled(!showSettled)}>${showSettled ? 'Hide' : 'Show'} ${settled.length} settled</button>
      ${showSettled && html`<div class="card">${settled.map(row)}</div>`}`}
  </div>`;
}

function DebtSheet({ data, debt, kind: kind0, onClose, onDone }) {
  const active = data.pockets.filter(p => !p.archived);
  const last = lsGet('trax.lastPocket');
  const defPocket = active.some(p => p.id === last) ? last : active[0]?.id ?? null;
  const txPocket = id => store.txPocket(id);
  const [kind, setKind] = useState(debt?.kind ?? kind0 ?? 'AR');
  const [date, setDate] = useState(debt?.date ?? today());
  const [name, setName] = useState(debt?.name ?? '');
  const [amount, setAmount] = useState(debt ? String(Math.round(debt.amount)) : '');
  // null = "Not sure": record no transaction (also for debts already reflected in the balances).
  const [pocket, setPocket] = useState(debt ? txPocket(debt.open_tx_id) : defPocket);
  const [settlePocket, setSettlePocket] = useState(defPocket);

  const save = async () => {
    if (!name.trim() || !num(amount)) return toast('Enter a name and an amount');
    try {
      await store.saveDebt(debt?.id ?? null, { kind, date, name: name.trim(), amount: num(amount) }, pocket);
      if (pocket) lsSet('trax.lastPocket', pocket);
      onDone();
    } catch (e) { toast(e.message); }
  };
  const settle = async () => {
    try {
      if (debt.settled_at) await store.unsettleDebt(debt.id);
      else await store.settleDebt(debt.id, settlePocket);
      onDone();
    } catch (e) { toast(e.message); }
  };
  const remove = async () => {
    if (!confirm(`Delete "${debt.name}" and its transactions?`)) return;
    try { await store.deleteDebt(debt.id); onDone(); } catch (e) { toast(e.message); }
  };
  // "Not sure" comes first so it is visible without scrolling: forgetting which pocket paid is
  // common, and then no transaction is recorded (fix the balance later with "Set balance to").
  const pocketChips = (value, onPick) => html`<div class="chips">
    <button class=${'chip' + (!value ? ' on' : '')} onClick=${() => onPick(null)}>Not sure</button>
    ${active.map(p => html`<button key=${p.id} class=${'chip' + (value === p.id ? ' on' : '')} onClick=${() => onPick(p.id)}>${p.name}</button>`)}</div>`;

  return html`<${Panel} title=${(debt ? 'Edit ' : 'Add ') + (kind === 'AR' ? 'receivable' : 'payable')} onClose=${onClose}
    right=${html`<button class="link" onClick=${save}>Save</button>`}>
    <${Seg} value=${kind} onChange=${setKind} options=${[['AR', 'Receivable'], ['AP', 'Payable']]} />
    <div class="field"><span>Description</span><input value=${name} onInput=${e => setName(e.target.value)} /></div>
    <div class="field"><span>Amount</span><input inputmode="numeric" placeholder="0" value=${amount ? fmt(amount) : ''} onInput=${e => setAmount(digits(e.target.value))} /></div>
    <div class="field"><span>Date</span><input type="date" value=${date} onInput=${e => e.target.value && setDate(e.target.value)} /></div>
    <div class="lbl">${kind === 'AR' ? 'Paid from' : 'Received into'}</div>
    ${pocketChips(pocket, setPocket)}
    ${debt && !debt.settled_at && html`
      <div class="lbl">${kind === 'AR' ? 'Repaid into' : 'Paid back from'}</div>
      ${pocketChips(settlePocket, setSettlePocket)}`}
    ${debt && html`<button class="secondary" style="margin-top:20px" onClick=${settle}>${debt.settled_at ? 'Mark as unsettled' : 'Mark as settled'}</button>
      <button class="secondary danger" onClick=${remove}>Delete</button>`}
  <//>`;
}

// Handle for poking at the prototype from the console.
window.__trax = { store, curMonth };
render(html`<${App} />`, document.getElementById('root'));
</script>
